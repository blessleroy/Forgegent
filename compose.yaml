name: forgegent

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-web
    ports:
      - "3000:3000"
    environment:
      FORGEGENT_DATA_DIR: /data
      FORGEGENT_ADMIN_EMAIL: ${FORGEGENT_ADMIN_EMAIL:-}
      FORGEGENT_ADMIN_PASSWORD: ${FORGEGENT_ADMIN_PASSWORD:-}
      FORGEGENT_PUBLIC_URL: ${FORGEGENT_PUBLIC_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (e.g. openssl rand -base64 32)}
      BETTER_AUTH_URL: ${FORGEGENT_PUBLIC_URL:-http://localhost:3000}
      NODE_ENV: production
    volumes:
      - forgegent-data:/data
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-runner
    environment:
      FORGEGENT_DATA_DIR: /data
      FORGEGENT_MAX_CONCURRENCY: ${FORGEGENT_MAX_CONCURRENCY:-5}
      NODE_ENV: production
    volumes:
      - forgegent-data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  forgegent-data:
